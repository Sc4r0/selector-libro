<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Selección de Libro</title>
        <link rel="icon" href="favicon.png" type="image/png" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container-fluid py-5">
            <!-- Input Section (both sections start hidden; index.js decides which to show) -->
            <div class="row justify-content-center mb-4 d-none" id="enlace">
                <div class="col-md-8">
                    <h2 class="text-center mb-4"><label for="goodreadsListLink">Introduce el enlace de tu estantería de Goodreads:</label></h2>
                    <form id="syncForm" novalidate>
                        <div class="input-group has-validation">
                            <input type="url" id="goodreadsListLink" class="form-control" placeholder="https://www.goodreads.com/review/list/…" autocomplete="url" aria-describedby="linkFeedback" required />
                            <button id="syncButton" type="submit" class="btn btn-primary">
                                <span id="syncSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                                <span id="syncLabel" role="status">Sincronizar libros</span>
                            </button>
                            <div id="linkFeedback" class="invalid-feedback">Introduce un enlace válido de una estantería de Goodreads</div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Book Info Section -->
            <div id="random" class="d-none">
                <button id="backButton" type="button" class="icon-button" aria-label="Cambiar de lista" title="Cambiar de lista">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-arrow-left-circle" viewBox="0 0 16 16" aria-hidden="true">
                        <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z" />
                    </svg>
                </button>

                <div class="row justify-content-center">
                    <div class="col-md-8 text-center">
                        <h3>Número de libros en la lista: <span id="bookCount">0</span></h3>
                    </div>

                    <div class="col-md-8 text-center mt-4">
                        <h4>Último libro añadido a la lista:</h4>
                        <h5 id="lastSyncedBook"></h5>
                        <img id="lastSyncedBookImg" class="book-cover book-cover-small img-fluid mt-2 d-none" alt="Portada del último libro añadido" />
                    </div>
                </div>

                <!-- Random Book Section -->
                <div class="row justify-content-center mt-4">
                    <div class="col-md-6 text-center">
                        <button id="randomBookButton" type="button" class="btn btn-success mb-4" disabled>Elegir libro al azar</button>
                    </div>
                </div>

                <hr />

                <div class="row justify-content-center align-items-center">
                    <div class="col-md-6 text-center" aria-live="polite">
                        <h5 id="randomBook" class="mt-3"></h5>
                        <img id="bookImg" class="book-cover img-fluid mt-3 d-none" alt="Portada del libro elegido" />
                        <br />
                        <a id="goodreadsLink" href="#" class="btn mt-3 d-none" target="_blank" rel="noopener noreferrer" title="Ver libro en Goodreads">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Goodreads_logo.svg" alt="Ver libro en Goodreads" class="goodreads-logo img-fluid" />
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
